name: iOS app

# Every push compiles the app (no Apple account needed).
# With the signing secrets configured, the app is also archived and signed;
# pushes to main (or a manual run) upload the build to TestFlight.
#
# Secrets (Settings -> Secrets and variables -> Actions):
#   APPLE_TEAM_ID   10-character team ID (developer.apple.com -> Membership)
#   ASC_KEY_ID      App Store Connect API key ID
#   ASC_ISSUER_ID   App Store Connect API issuer ID
#   ASC_KEY_P8      full contents of the AuthKey_XXXX.p8 file

on:
  push:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:
    inputs:
      upload:
        description: Upload to TestFlight
        type: boolean
        default: true

# One signing build at a time across all branches: each run creates (and
# afterwards revokes) a development certificate, so overlapping runs would
# revoke each other's certificate mid-build. Queue instead of cancelling.
concurrency:
  group: ios-signing
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      PROJECT: ios/NotificationForward.xcodeproj
      SCHEME: NotificationForward
    steps:
      - uses: actions/checkout@v5

      - name: Select newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          SDK=$(xcrun --sdk iphoneos --show-sdk-version)
          echo "iOS SDK $SDK"
          # AccessoryNotifications needs the iOS 26.5 SDK or newer.
          if [ "$(printf '%s\n' 26.5 "$SDK" | sort -V | head -1)" != "26.5" ]; then
            echo "::error::iOS SDK $SDK is older than 26.5; this runner image can't build the app yet."
            exit 1
          fi

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen --version
          cd ios && xcodegen generate

      - name: Print accessory framework APIs
        # The SDK's Swift interfaces are the source of truth for these new
        # frameworks (Apple's docs and samples disagree in places).
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          for fw in AccessoryNotifications AccessoryTransportExtension; do
            f=$(find "$SDK/System/Library/Frameworks/$fw.framework" -name 'arm64e-apple-ios.swiftinterface' | head -1)
            echo "::group::$fw ($f)"
            grep -vE '^\s*(//|@available\(\*|#if|#else|#endif)' "$f" | grep -vE '^\s*$' || true
            echo "::endgroup::"
          done

      - name: Compile (unsigned)
        run: |
          set -o pipefail
          # Drop the multi-KB compiler command lines so errors stay readable.
          xcodebuild build -quiet \
            -project "$PROJECT" -scheme "$SCHEME" \
            -configuration Release -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$RUNNER_TEMP/compile.log" \
            | { grep -vE 'swift-frontend -frontend|^Failed frontend command|^\s*\^?~*$' || true; }

      - name: Check signing secrets
        id: secrets
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "::notice::Pull request: compile only, no signing."
          elif [ -n "$ASC_KEY_P8" ] && [ -n "$APPLE_TEAM_ID" ]; then
            echo "signing=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Signing secrets not set; skipping archive and TestFlight upload."
          fi

      - name: Revoke stale CI development certificates
        # Every run is a fresh Mac, so Xcode creates a new development
        # certificate each time; revoke the old ones before Apple's cap is hit.
        if: steps.secrets.outputs.signing == 'true'
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          python3 -m venv "$RUNNER_TEMP/certenv"
          "$RUNNER_TEMP/certenv/bin/pip" install --quiet pyjwt cryptography
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/AuthKey_cleanup.p8"
          ASC_KEY_PATH="$RUNNER_TEMP/AuthKey_cleanup.p8" "$RUNNER_TEMP/certenv/bin/python" .github/scripts/revoke_ci_dev_certs.py
          rm -f "$RUNNER_TEMP/AuthKey_cleanup.p8"

      - name: Archive (signed)
        if: steps.secrets.outputs.signing == 'true'
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          KEY="$RUNNER_TEMP/AuthKey.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$KEY"
          xcodebuild archive -quiet \
            -project "$PROJECT" -scheme "$SCHEME" \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/NotificationForward.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" 2>&1 | tee "$RUNNER_TEMP/archive.log"

      - name: Inspect app bundle
        # Shows where the extensions are embedded, their extension points and
        # signed entitlements, so iOS-side launch problems can be diagnosed.
        if: steps.secrets.outputs.signing == 'true'
        run: |
          APP=$(find "$RUNNER_TEMP/NotificationForward.xcarchive/Products/Applications" -maxdepth 1 -name '*.app' | head -1)
          echo "App: $APP"
          find "$APP" -maxdepth 2 \( -name '*.appex' -o -name 'Extensions' -o -name 'PlugIns' \) -print
          for ext in "$APP"/Extensions/*.appex "$APP"/PlugIns/*.appex; do
            [ -d "$ext" ] || continue
            echo "::group::$(basename "$ext")"
            plutil -extract EXAppExtensionAttributes json -o - "$ext/Info.plist" 2>/dev/null || echo "(no EXAppExtensionAttributes)"
            echo
            plutil -extract NSExtension json -o - "$ext/Info.plist" 2>/dev/null && echo "(has NSExtension)"
            for k in NSAccessorySetupKitSupports NSAccessorySetupBluetoothServices CFBundleIdentifier; do
              printf '%s: ' "$k"; plutil -extract "$k" json -o - "$ext/Info.plist" 2>/dev/null || echo "-"; echo
            done
            codesign -d --entitlements - --xml "$ext" 2>/dev/null | plutil -convert json -o - - 2>/dev/null || true
            echo
            echo "::endgroup::"
          done
          echo "::group::App entitlements"
          codesign -d --entitlements - --xml "$APP" 2>/dev/null | plutil -convert json -o - - 2>/dev/null || true
          echo
          echo "::endgroup::"

      - name: Upload to TestFlight
        if: >-
          steps.secrets.outputs.signing == 'true' &&
          ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
           (github.event_name == 'workflow_dispatch' && inputs.upload))
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/NotificationForward.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" 2>&1 | tee "$RUNNER_TEMP/export.log"
          echo "::notice::Build ${{ github.run_number }} uploaded. It appears in TestFlight after Apple's processing (usually 5-30 min)."

      - name: Revoke stale CI development certificates (after build)
        # Every run is a fresh Mac, so Xcode creates a new development
        # certificate each time; revoke the old ones before Apple's cap is hit.
        if: always() && steps.secrets.outputs.signing == 'true'
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          python3 -m venv "$RUNNER_TEMP/certenv"
          "$RUNNER_TEMP/certenv/bin/pip" install --quiet pyjwt cryptography
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/AuthKey_cleanup.p8"
          ASC_KEY_PATH="$RUNNER_TEMP/AuthKey_cleanup.p8" MIN_AGE_MINUTES=0 "$RUNNER_TEMP/certenv/bin/python" .github/scripts/revoke_ci_dev_certs.py || true
          rm -f "$RUNNER_TEMP/AuthKey_cleanup.p8"

      - name: Remove API key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"

      - name: Keep logs
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: xcode-logs
          path: ${{ runner.temp }}/*.log
          if-no-files-found: ignore
