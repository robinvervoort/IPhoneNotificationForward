name: iPhone Notification Forward
version: "0.4.0"
slug: notification_forward
description: Receive your iPhone's notifications in Home Assistant via Apple notification forwarding (EU)
url: https://github.com/robinvervoort/IPhoneNotificationForward
arch:
  - amd64
  - aarch64
init: false
startup: services
boot: auto
host_dbus: true
homeassistant_api: true
hassio_api: true
services:
  - mqtt:want
options:
  adapter: hci0
  device_name: NotifFwd
  event_type: iphone_notification
  sensor_entity: sensor.iphone_last_notification
  inbound_event_type: notification_forward_inbound
  log_level: info
  hci_trace: false
  summaries:
    - name: Zabbix
      app: Outlook
      sender: zabbix
      pattern: '^\[(?P<host>[^\]]+)\] Problem: (?P<problem>.+)$'
      exclude: Escalation canceled
  night: "23:00-06:30"
schema:
  adapter: str
  device_name: str
  event_type: str
  sensor_entity: str
  inbound_event_type: str
  log_level: list(debug|info|warning|error)
  hci_trace: bool
  summaries:
    - name: str
      app: str?
      sender: str?
      pattern: str
      exclude: str?
  night: match(^(\d\d:\d\d-\d\d:\d\d)?$)
  heartbeat_url: url?
