# Generate the Xcode project with:  brew install xcodegen && xcodegen
name: NotificationForward
options:
  bundleIdPrefix: be.robinvervoort
  deploymentTarget:
    iOS: "26.5"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""          # set your Apple developer team ID
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"   # iPhone only (framework requirement)
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"  # CI overrides this with the run number

# Keys every target that touches the bridge needs, so AccessorySetupKit
# grants them the same approved accessory.
accessoryPlist: &accessoryPlist
  NSAccessorySetupKitSupports: [Bluetooth]
  NSAccessorySetupBluetoothServices: ["46B6C6E3-47D4-4FD7-98B7-D41D1109B69B"]
  NSAccessorySetupBluetoothNames: ["NotifFwd"]
  NSBluetoothAlwaysUsageDescription: Notification Forward talks to your Home Assistant Bluetooth bridge.

targets:
  NotificationForward:
    type: application
    platform: iOS
    sources: [NotificationForward, Shared]
    info:
      path: NotificationForward/Info.plist
      properties:
        <<: *accessoryPlist
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: NotifyFwd
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false   # only standard HTTPS/CryptoKit
        UIBackgroundModes: [bluetooth-central]
        # App Store validation (error 90474) requires all four orientations
        # now that UIRequiresFullScreen is deprecated.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: NotificationForward/NotificationForward.entitlements
      properties:
        com.apple.security.application-groups: [group.be.robinvervoort.notificationforward]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: be.robinvervoort.notificationforward
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme: {}                    # shared scheme, used by CI to build/archive
    dependencies:
      - target: DataProvider
      - target: TransportSecurity
      - target: Transport

  DataProvider:
    type: extensionkit-extension
    platform: iOS
    sources: [DataProvider, Shared]
    info:
      path: DataProvider/Info.plist
      properties:
        <<: *accessoryPlist
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Notification Forward Data Provider
        EXAppExtensionAttributes:
          EXExtensionPointIdentifier: com.apple.accessory-data-provider
          EXCapabilities: [AccessoryNotifications.NotificationsForwarding]
    entitlements:
      path: DataProvider/DataProvider.entitlements
      properties:
        com.apple.developer.accessory-data-provider: true
        com.apple.security.application-groups: [group.be.robinvervoort.notificationforward]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: be.robinvervoort.notificationforward.dataprovider

  TransportSecurity:
    type: extensionkit-extension
    platform: iOS
    sources: [TransportSecurity, Shared]
    info:
      path: TransportSecurity/Info.plist
      properties:
        <<: *accessoryPlist
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Notification Forward Transport Security
        EXAppExtensionAttributes:
          EXExtensionPointIdentifier: com.apple.accessory-transport-security
    entitlements:
      path: TransportSecurity/TransportSecurity.entitlements
      properties:
        com.apple.developer.accessory-transport-security: true
        com.apple.security.application-groups: [group.be.robinvervoort.notificationforward]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: be.robinvervoort.notificationforward.transportsecurity

  Transport:
    type: extensionkit-extension
    platform: iOS
    sources: [Transport, Shared]
    info:
      path: Transport/Info.plist
      properties:
        <<: *accessoryPlist
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Notification Forward Transport
        UIBackgroundModes: [bluetooth-central]
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: be.robinvervoort.notificationforward.accessory-transport
            UTTypeConformsTo: [public.data-access-protocol]
            UTTypeDescription: Notification Forward accessory transport
        EXAppExtensionAttributes:
          EXExtensionPointIdentifier: com.apple.accessory-transport-extension
    entitlements:
      path: Transport/Transport.entitlements
      properties:
        com.apple.developer.accessory-transport-extension: true
        com.apple.security.application-groups: [group.be.robinvervoort.notificationforward]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: be.robinvervoort.notificationforward.transport
